version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
  build: ./backend
  container_name: django_backend
  command: >
    sh -c "
    python manage.py migrate &&
    gunicorn user_system.wsgi:application --bind 0.0.0.0:8000
    "
  volumes:
    - ./backend:/app
  env_file:
    - .env
  ports:
    - "8000:8000"
  depends_on:
    - db


  frontend:
    build: ./frontend
    container_name: vue_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
